services:
  - type: web
    name: hardware-tools-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: hardware-tools-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@hardwaretools.lk
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: hardware-tools-db
    databaseName: hardware_tools_db
    user: hardware_tools_user
    plan: free